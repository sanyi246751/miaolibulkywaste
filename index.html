<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大型廢棄傢俱預約清運申請系統</title>
  <meta name="description" content="家戶免費大型廢棄傢俱線上預約清運申請系統" />
  <meta name="theme-color" content="#047857" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="大型傢俱清運" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="icon" href="%BASE_URL%pwa-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="%BASE_URL%pwa-icon.svg" />

  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <!-- QRCode JS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      background: #f7faf8;
      color: #173b32;
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #059669;
      outline-offset: 2px;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(15, 118, 88, 0.13);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 118, 88, 0.12);
      box-shadow: 0 18px 50px -34px rgba(6, 78, 59, .28);
    }

    /* Warm light civic-service theme */
    .civic-shell {
      color: #173b32;
      background:
        radial-gradient(circle at 8% 0%, rgba(167, 243, 208, .48), transparent 30rem),
        radial-gradient(circle at 92% 18%, rgba(253, 230, 138, .25), transparent 26rem),
        linear-gradient(180deg, #f9fcf9 0%, #f4f8f5 62%, #f8faf9 100%);
      isolation: isolate;
      position: relative;
    }

    .civic-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .3;
      background-image: radial-gradient(rgba(6, 95, 70, .16) .7px, transparent .7px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
    }

    .booking-hero {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 52%, #fff7ed 100%) !important;
    }

    .civic-shell input:not([type="checkbox"]):not([type="radio"]),
    .civic-shell select,
    .civic-shell textarea {
      background: rgba(255, 255, 255, .96) !important;
      border-color: #cbdcd4 !important;
      color: #173b32 !important;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, .025);
    }

    .civic-shell input::placeholder,
    .civic-shell textarea::placeholder {
      color: #8a9e97 !important;
    }

    .civic-shell input:focus,
    .civic-shell select:focus,
    .civic-shell textarea:focus {
      border-color: #059669 !important;
    }

    .civic-shell :where(.text-white, .text-slate-100) {
      color: #12372d !important;
    }

    .civic-shell :where(.text-slate-200) {
      color: #284b42 !important;
    }

    .civic-shell :where(.text-slate-300) {
      color: #49675f !important;
    }

    .civic-shell :where(.text-slate-400) {
      color: #647b74 !important;
    }

    .civic-shell :where(.text-slate-500) {
      color: #789089 !important;
    }

    .civic-shell :where(.border-slate-700, .border-slate-800) {
      border-color: #d5e2dc !important;
    }

    .civic-shell :where(.divide-slate-700, .divide-slate-800)> :not([hidden])~ :not([hidden]) {
      border-color: #e3ebe7 !important;
    }

    .civic-shell :where(.bg-slate-900, .bg-slate-800, .bg-slate-700) {
      background-color: #eef5f1 !important;
    }

    .civic-shell table {
      background: rgba(255, 255, 255, .76);
    }

    .civic-shell thead {
      color: #45645b !important;
    }

    .civic-shell tbody tr:hover {
      background-color: #eff8f3 !important;
    }

    .civic-shell header .text-white,
    .civic-shell footer .text-white {
      color: #fff !important;
    }

    .civic-shell>.fixed.inset-0 {
      background-color: rgba(6, 24, 19, .7) !important;
    }

    .civic-shell>.fixed.inset-0>div {
      background-color: #fff !important;
    }

    .civic-shell footer,
    .civic-shell footer .text-slate-400,
    .civic-shell footer .text-slate-500 {
      color: rgba(236, 253, 245, .68) !important;
    }

    .civic-shell .success-summary,
    .civic-shell .success-summary * {
      color: #ffffff !important;
    }

    /* Mobile layout: keep forms, cards and dialogs inside the viewport. */
    @media (max-width: 640px) {

      html,
      body,
      #root {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      .civic-shell main {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

      .civic-shell .glass-card,
      .civic-shell .glass-panel {
        border-radius: 1rem !important;
      }

      .civic-shell :where(input, select, textarea, button, a) {
        min-width: 0;
      }

      .civic-shell code {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .civic-shell>.fixed.inset-0 {
        align-items: flex-start !important;
        overflow-y: auto;
        padding: 0.75rem !important;
      }

      .civic-shell>.fixed.inset-0>div {
        max-height: none !important;
        padding: 1rem !important;
        border-radius: 1rem !important;
      }

      #printable-tag {
        padding: 0.75rem !important;
      }
    }

    /* Print media styling for furniture booking identification tag */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }

      /* 隱藏不想印出來的區塊 (Header, Main, Footer) */
      .no-print {
        display: none !important;
      }

      /* 將網頁底色改為白色，取消高度限制 */
      html,
      body {
        background: white !important;
        color: black !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* 強制將 Modal 彈出視窗的固定定位解除，變成一般的網頁區塊 */
      .fixed.inset-0 {
        position: relative !important;
        display: block !important;
        background: white !important;
        padding: 0 !important;
      }

      /* 強制解除 Modal 內容區塊的高度限制、捲動軸與黑色背景 */
      .fixed.inset-0>div {
        background: white !important;
        border: none !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
      }

      /* 隱藏 Modal 的標題列(打叉按鈕)與下方的列印按鈕區塊 */
      .fixed.inset-0>div>div:first-child,
      .fixed.inset-0>div>div:last-child {
        display: none !important;
      }

      /* 確保標籤本身的邊框與顏色正確 */
      #printable-tag {
        border: 4px dashed #000000 !important;
        color: #000000 !important;
        width: 180mm !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        text-align: center !important;
      }
    }
  </style>
</head>

<body class="min-h-screen selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
